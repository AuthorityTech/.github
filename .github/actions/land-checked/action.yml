name: Land checked
description: >-
  Verifies the exact land/ commit against main's native required checks and all present checks,
  then fast-forwards main. Rebase and recheck when main moves. Needs contents write,
  statuses read; dispatching source workflows also needs statuses write, checks read and actions write.
  With no dispatch input, existing callers retain their Vercel/status contract.

inputs:
  check-workflows:
    description: Newline-separated existing workflows to dispatch on each exact land commit. Each passed job named as a required context of main is reported as a commit status, since GitHub counts no dispatched check run toward a ruleset. Missing owners fail closed.
    default: ""
  build-minutes:
    description: Longest wait for checks on one commit. A dispatched check-workflows run that has started is waited for until it concludes; its own timeout-minutes bounds it.
    default: "15"
  rounds:
    description: Commits to try, rebasing onto main each time main moved during one.
    default: "6"
  after-rebase:
    description: Shell commands run after each rebase onto a moved main; a failure stops the landing.
    default: ""

outputs:
  sha:
    description: The commit main now points at.
    value: ${{ steps.land.outputs.sha }}
  landed:
    description: '"true" once main points at sha.'
    value: ${{ steps.land.outputs.landed }}

runs:
  using: composite
  steps:
    - id: land
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_MINUTES: ${{ inputs.build-minutes }}
        ROUNDS: ${{ inputs.rounds }}
        CHECK_WORKFLOWS: ${{ inputs.check-workflows }}
        AFTER_REBASE: ${{ inputs.after-rebase }}
      run: bash "$GITHUB_ACTION_PATH/land.sh"
