name: Publication gate regressions

# Every pull request runs the whole suite, and main's ruleset requires `test`, so a change to
# any shared action or workflow (editorial-merge-paths.yml had no test run at all) waits for it
# and a hand merge cannot land a red gate on every site that uses these actions.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -v
