name: IndexNow for changed sitemap URLs (reusable)

# After a commit's production deploy is live, tell IndexNow engines (Bing, Yandex and others) about the
# sitemap URLs whose <lastmod> is recent. For sites whose pages are built from data and have no
# per-page publish step. The key is public: its file is served at https://<host>/<key>.txt.
#
# Call it from a push workflow:
#   permissions: { contents: read, statuses: read }
#   jobs:
#     indexnow:
#       uses: AuthorityTech/.github/.github/workflows/indexnow-sitemap.yml@main
#       with: { host: example.com, key: <indexnow key> }

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      key:
        required: true
        type: string
      lookback_days:
        required: false
        type: number
        default: 1
      deploy_timeout_minutes:
        required: false
        type: number
        default: 25

permissions:
  contents: read
  statuses: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for this commit's production deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TIMEOUT_MIN: ${{ inputs.deploy_timeout_minutes }}
        run: |
          deadline=$(( $(date +%s) + TIMEOUT_MIN * 60 ))
          while true; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '[.statuses[] | select(.context | startswith("Vercel")) | select(.context | test("Comments") | not)] | map(.state) | if length == 0 then "none" elif any(. == "failure" or . == "error") then "failure" elif all(. == "success") then "success" else "pending" end')
            echo "deploy status: $state"
            if [ "$state" = "success" ]; then break; fi
            if [ "$state" = "failure" ]; then echo "Deploy failed; nothing to announce."; echo "SKIP=1" >> "$GITHUB_ENV"; break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then echo "::warning::deploy not confirmed after ${TIMEOUT_MIN} minutes; submitting anyway"; break; fi
            sleep 30
          done

      - name: Submit recent sitemap URLs to IndexNow
        if: env.SKIP != '1'
        env:
          HOST: ${{ inputs.host }}
          KEY: ${{ inputs.key }}
          LOOKBACK: ${{ inputs.lookback_days }}
        run: |
          node --input-type=module - <<'EOF'
          const host = process.env.HOST, key = process.env.KEY;
          const cutoff = new Date(Date.now() - Number(process.env.LOOKBACK) * 864e5).toISOString().slice(0, 10);
          const get = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.text(); };
          const entries = (xml) => [...xml.matchAll(/<url>([\s\S]*?)<\/url>/g)].map((m) => ({ loc: (/<loc>([^<]+)<\/loc>/.exec(m[1]) || [])[1], mod: (/<lastmod>([^<]+)<\/lastmod>/.exec(m[1]) || [])[1] }));
          let xml = await get("https://" + host + "/sitemap.xml");
          let rows = [];
          if (/<sitemapindex/.test(xml)) { for (const m of xml.matchAll(/<loc>([^<]+)<\/loc>/g)) rows.push(...entries(await get(m[1]))); } else rows = entries(xml);
          const urls = [...new Set(rows.filter((r) => r.loc && r.mod && r.mod.slice(0, 10) >= cutoff && new URL(r.loc).hostname === host).map((r) => r.loc))];
          console.log("sitemap entries " + rows.length + ", changed since " + cutoff + ": " + urls.length);
          if (!urls.length) process.exit(0);
          for (let i = 0; i < urls.length; i += 10000) {
            const res = await fetch("https://api.indexnow.org/IndexNow", { method: "POST", headers: { "Content-Type": "application/json; charset=utf-8" }, body: JSON.stringify({ host, key, keyLocation: "https://" + host + "/" + key + ".txt", urlList: urls.slice(i, i + 10000) }) });
            console.log("IndexNow " + res.status + " for " + Math.min(10000, urls.length - i) + " URLs");
            if (res.status !== 200 && res.status !== 202) { console.error(await res.text()); process.exit(1); }
          }
          EOF
