name: Site Integrity (Reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for site validation.
        required: false
        type: string
        default: "20"
      install-command:
        description: Dependency install command. Leave empty to skip.
        required: false
        type: string
        default: "npm ci"
      internal-links-config:
        description: Internal links config path relative to repo root. Leave empty to skip.
        required: false
        type: string
        default: "internal-links.config.json"
      schema-command:
        description: Optional shell command block for site-specific schema/build validation.
        required: false
        type: string
        default: ""
      internal-links-paths:
        description: Newline-separated path globs that should run internal link validation.
        required: false
        type: string
        default: |
          content/**
          internal-links.config.json
      schema-paths:
        description: Newline-separated path globs that should run schema/build validation.
        required: false
        type: string
        default: ""
      extra-commands:
        description: Optional shell command block for additional site-specific checks.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      internal_links: ${{ steps.detect.outputs.internal_links }}
      schema: ${{ steps.detect.outputs.schema }}

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        env:
          INTERNAL_LINKS_PATHS: ${{ inputs.internal-links-paths }}
          SCHEMA_PATHS: ${{ inputs.schema-paths }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          FILES="$RUNNER_TEMP/site-integrity-files.txt"
          : > "$FILES"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF:-}" ]]; then
            # Never fetch the base ref with --depth. actions/checkout above made a
            # complete clone (fetch-depth: 0), and a shallow fetch into a complete
            # clone re-grafts it: git writes .git/shallow, the base branch loses its
            # ancestry, and "origin/<base>...HEAD" dies with "no merge base" whenever
            # the PR branch is behind a base branch that has moved. On these repos an
            # automated publisher writes the base branch every few minutes, so that
            # race fired constantly and made the dependent jobs skip.
            git fetch --no-tags --force origin \
              "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

            # Prefer the base SHA carried by the event: it is the base as it stood
            # when the run was queued, so it cannot drift mid-run.
            BASE_REF_NAME="origin/${GITHUB_BASE_REF}"
            BASE="${PR_BASE_SHA:-}"
            if [[ -z "$BASE" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$BASE_REF_NAME"
            fi

            MERGE_BASE="$(git merge-base "$BASE" HEAD 2>/dev/null || true)"
            if [[ -z "$MERGE_BASE" && "$BASE" != "$BASE_REF_NAME" ]]; then
              MERGE_BASE="$(git merge-base "$BASE_REF_NAME" HEAD 2>/dev/null || true)"
            fi

            if [[ -n "$MERGE_BASE" ]]; then
              git diff --name-only "$MERGE_BASE" HEAD > "$FILES"
            else
              # Fail safe, not silent: an undetermined change set must widen coverage,
              # never remove it. An empty list makes every gated job run.
              echo "::warning::site-integrity: could not resolve a merge base against ${GITHUB_BASE_REF}; running all gated checks."
              : > "$FILES"
            fi
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "${PUSH_BEFORE_SHA}" "${GITHUB_SHA}" > "$FILES" || git show --name-only --pretty= "${GITHUB_SHA}" > "$FILES"
          else
            git show --name-only --pretty= "${GITHUB_SHA}" > "$FILES"
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const out = process.env.GITHUB_OUTPUT;
          const files = fs.readFileSync(`${process.env.RUNNER_TEMP}/site-integrity-files.txt`, 'utf8')
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);

          function patterns(name) {
            return (process.env[name] || '')
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean);
          }

          function globToRegex(glob) {
            let source = glob.replace(/[.+^${}()|[\]\\]/g, '\\$&');
            source = source.replace(/\*\*/g, '.*').replace(/\*/g, '[^/]*');
            return new RegExp(`^${source}$`);
          }

          function matches(patternList) {
            if (!files.length) return true;
            if (!patternList.length) return false;
            const regexes = patternList.map(globToRegex);
            return files.some((file) => regexes.some((regex) => regex.test(file)));
          }

          fs.appendFileSync(out, `internal_links=${matches(patterns('INTERNAL_LINKS_PATHS'))}\n`);
          fs.appendFileSync(out, `schema=${matches(patterns('SCHEMA_PATHS'))}\n`);
          NODE

  internal-links:
    needs: changes
    if: ${{ inputs.internal-links-config != '' && needs.changes.outputs.internal_links == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: site-integrity-links-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Run shared internal link checks
        uses: AuthorityTech/.github/.github/actions/site-integrity@main
        with:
          install-command: ""
          internal-links-config: ${{ inputs.internal-links-config }}
          schema-command: ""
          extra-commands: ""

  schema:
    needs: changes
    if: ${{ inputs.schema-command != '' && needs.changes.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: site-integrity-schema-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout site repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Run shared schema checks
        uses: AuthorityTech/.github/.github/actions/site-integrity@main
        with:
          install-command: ${{ inputs.install-command }}
          internal-links-config: ""
          schema-command: ${{ inputs.schema-command }}
          extra-commands: ${{ inputs.extra-commands }}
