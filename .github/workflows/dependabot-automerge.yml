name: Auto-merge Gate (Reusable)

# Merges a pull request once every status and check on its exact head commit has
# passed. The sites deploy from main and have no required checks for GitHub
# auto-merge to wait on, so the gate lives here: the Vercel build, the site's own
# guards and its Actions checks must all be green on the head being merged. Two
# kinds of pull request are eligible:
#
# - Dependabot patch or minor updates, grouped or single, where nothing changed in
#   package.json or package-lock.json crosses a major. Decided on the PR's own
#   events (the metadata action reads the pull_request payload).
# - Every other PR from a branch in this same repository into the default
#   branch, whatever the branch is named and whoever opened it, when the caller
#   lists editorial-required-checks (a caller that lists none, such as the App,
#   gets Dependabot only). The code still calls this kind "editorial" and keeps
#   its input and event names, because callers on @main and the post-merge
#   workflows read them. The branch name is not a hold: it was one until
#   2026-11-10 (only editorial/... merged), and agents renamed branches to get
#   past it (jaxonparrott.com #220 writer/ closed, #221 editorial/ merged), so it
#   guarded nothing (Jaxon, 2026-11-10: "Drop the hold"). What guards a merge is
#   the checks. A draft PR is not merged, and two kinds are left to their own
#   merger: Dependabot (judged as above, so a major is never merged as this
#   kind) and land/..., which the Gateway producer (jarvis site-landing.mjs)
#   rebase-merges itself at its Vercel-green head. Opener and publisher return;
#   nothing waits for this gate. Every name in
#   editorial-required-checks (a check run or a commit status context) must be
#   present and successful; a missing one is pending, never a pass. So list only
#   names that every such PR produces: the Vercel status, and checks whose
#   workflows run on every pull request, with no paths filter. "Every path the
#   publisher writes" is not enough, because hand-made PRs change code
#   too: portfolio-retired-pointers was filtered to content/** and portfolio/**,
#   and held a src-only PR (jaxonparrott.com #110) until it was merged by hand. A
#   path-filtered check needs no listing to block: every present check must pass.
#   Listed, it holds every editorial PR outside its paths forever, and each
#   evaluation of that PR exits successfully, so nothing shows it is stuck.
#
# Listing Vercel does not add page-check to that required list. page-check is
# the job id of the workflow named Page check. An editorial merge that finds it
# skipped, neutral, or absent records that on this run and still merges: a
# workflow that never started, a ruleset that did not run it, or a skip must not
# sit forever behind a green gate job. The record is this run's warning and
# summary. Two evaluations of one head can overlap, so it is not a pull request
# comment. A run that is still going waits, and the completion re-evaluates. A
# finished failure stops the merge, as any failed check does. A success merges
# with no warning, including the success that job uses when it could not read
# the pages. Dependabot and a caller that does not list Vercel are unchanged. A
# skipped indexnow or site-integrity run stays a pass.
#
# Jaxon can opt routine posts and retired-pages data out of requiring a preview
# status. The API file list must be complete and stable at the judged head; all
# three unconditional CI checks remain required. Every present status/check
# still blocks on failure or pending, including Vercel. No other caller changes.
#
# Both kinds fail closed: any failed status or check on the head stops the merge,
# at least one commit status must exist (except that scoped routine path),
# all present statuses must be success, every other check
# run must be success, skipped or neutral, and the merge names the head it judged,
# so GitHub refuses it if the branch moved.
#
# Editorial evaluations are single-shot and event-driven, with no sweeper and no
# waiting: each one reads the PR and its head commit once, merges if everything
# is green, and otherwise exits successfully. Besides the PR's own events, every
# successful commit status and every completed run of the site's PR workflows on
# a branch other than the default starts a new evaluation of the open eligible PRs whose
# head is that commit, so the event that completes the last check is the one that
# merges. A read that still shows the completing run's own checks unfinished is
# retried for up to a minute, since no later event may come. For the same reason
# a read that GitHub answers with a server error (5xx) or a dropped connection is
# retried for about 20 seconds; a write keeps its own handling and a 4xx is never
# retried. Evaluations never supersede or cancel each other, so an editorial PR
# head carries no cancelled or failed gate run. Two evaluations of the same green
# head can race: GitHub merges once, and the other is either refused and finds the
# PR merged, or told that its own merge succeeded too, with the same commit.
#
# Dependabot PRs are evaluated only on their own pull_request events, so one
# evaluation waits up to wait-minutes for the checks, and a newer one cancels the
# older.
#
# A base whose rules include a merge queue gets no merge, arm or enqueue from
# this gate, because GitHub's token cannot merge through a queue: a PR it arms
# while checks are pending never enters the queue, and one it queues once green
# gets a merge group that starts no workflow, which holds the whole queue until
# its check timeout. There a Dependabot PR this gate would have merged is
# labelled dependabot-eligible instead, with one comment, and a CodeOps seat
# merges it through the queue. Every Dependabot evaluation first takes that
# label off, so it marks only a head this gate judged eligible and green. An
# editorial PR on such a base is left for a seat. Labels and comments need only
# the pull-requests: write the merge already has. A base without a queue is
# unchanged.
#
# It never checks out or executes pull-request code; it reads Dependabot
# metadata, file contents through the API, commit statuses and check runs only.
#
# A merge made with GITHUB_TOKEN starts no push-triggered workflow, but GitHub
# does run a repository_dispatch it sends. So one evaluation whose merge of an
# editorial PR succeeded sends one repository_dispatch event, editorial-merged,
# with client_payload {before, after, pr}: the default branch moved from before
# to after, the squash commit. A successful merge is not ownership: GitHub told
# two concurrent evaluations of jaxonparrott.com #202 that each had merged it,
# with the same commit, and both sent the event. So an evaluation whose merge
# succeeded first creates the ref refs/editorial-merged/<after>, with the
# contents: write the merge already uses. GitHub creates a ref only once: the
# evaluation that creates it sends the event, and one refused because the ref
# already exists leaves it to that one. A claim that fails for any other reason
# is retried briefly, then the event is sent anyway with a warning, since a
# duplicate is better than a lost one. The refs stay: each points at a commit the
# default branch already holds, no ruleset or workflow trigger matches refs
# outside refs/heads and refs/tags, and deleting one would let a late evaluation
# claim its merge again. A site workflow that does something after a merge
# (search indexing, generated files) subscribes to it and calls
# editorial-merge-paths.yml, which applies that workflow's own push paths to
# before..after. A workflow on deployment_status needs neither: Vercel's
# deployment of the merge starts it. Dependabot merges send nothing: no
# subscribed workflow watches package files.
#
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened, ready_for_review]
#     status:
#     workflow_run:
#       workflows: [Site Integrity, Portfolio Retired Pointers]  # the site's PR workflows
#       types: [completed]
#   permissions:
#     contents: write
#     pull-requests: write
#     actions: read
#     checks: read
#     statuses: read
#   jobs:
#     automerge:
#       uses: AuthorityTech/.github/.github/workflows/dependabot-automerge.yml@main
#       with:
#         editorial-required-checks: |
#           Vercel
#           portfolio-retired-pointers


on:
  workflow_call:
    inputs:
      wait-minutes:
        description: How long one Dependabot evaluation waits for the head commit's checks. Editorial evaluations never wait.
        required: false
        type: number
        default: 40
      editorial-content-without-preview:
        description: Jaxon only. Routine posts and the retired-pages data refresh use all required CI checks without requiring a Vercel preview status. Other changes and callers retain the preview requirement.
        required: false
        type: boolean
        default: false
      editorial-required-checks:
        description: Newline-separated check run names or commit status contexts that must be present and successful before a non-Dependabot PR merges. Listing any opts every PR from a branch in this repository into the default branch (not a draft, not land/) into this gate, whatever its branch name; listing none leaves this gate to Dependabot. Skipped, neutral, pending and missing do not meet a listed name. List only names every editorial PR produces, from workflows with no pull_request paths filter; a path-filtered check blocks whenever it runs without being listed, and listing one holds every editorial PR outside its paths.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  # Read the head commit's build status, check runs and this gate's own runs; an
  # explicit permissions block grants nothing it does not name.
  actions: read
  checks: read
  statuses: read

jobs:
  # Which open PRs this event can merge. Cheap filters run here, before any runner
  # starts; the step re-reads each PR from the API.
  resolve:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       (github.event.pull_request.user.login == 'dependabot[bot]' ||
        (inputs.editorial-required-checks != '' &&
         !startsWith(github.event.pull_request.head.ref, 'land/') &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.base.ref == github.event.repository.default_branch))) ||
      (github.event_name == 'status' && github.event.state == 'success' &&
       inputs.editorial-required-checks != '' &&
       format(',{0},', join(github.event.branches.*.name, ',')) != format(',{0},', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && inputs.editorial-required-checks != '' &&
       github.event.workflow_run.head_branch != github.event.repository.default_branch &&
       !startsWith(github.event.workflow_run.head_branch, 'land/') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - name: Find the eligible open PRs whose head is this commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SHA: ${{ github.event.sha || github.event.workflow_run.head_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGER_SUITE: ${{ github.event.workflow_run.check_suite_id }}
        run: |
          set -euo pipefail
          # A read GitHub answers with a server error or a dropped connection is
          # retried briefly: this evaluation may be the last event its PR gets
          # (website #939 sat green and unmerged after one 502 on 2026-11-04).
          # Only reads: a write keeps its own handling, and a 4xx is never retried.
          # The resolve and merge steps carry this function identically.
          gh() {
            local arg read=1 out err try code=0
            [[ ${1:-} == api ]] || read=0
            for arg in "$@"; do
              case $arg in -X*|--method|--method=*|-f|-F|--field|--field=*|--raw-field|--raw-field=*|--input|--input=*) read=0 ;; esac
            done
            (( read )) || { command gh "$@"; return; }
            out=$(mktemp) err=$(mktemp)
            for try in 1 2 3 4; do
              if command gh "$@" >"$out" 2>"$err"; then cat "$out"; rm -f "$out" "$err"; return 0; else code=$?; fi
              grep -qE 'HTTP 5[0-9]{2}|i/o timeout|connection reset|unexpected EOF|TLS handshake timeout' "$err" && (( try < 4 )) || break
              echo "GitHub answered a read with: $(tr '\n' ' ' <"$err" | head -c 160); retrying." >&2
              sleep $((try * 3))
            done
            cat "$err" >&2; rm -f "$out" "$err"; return "$code"
          }
          if [[ $EVENT == pull_request_target ]]; then
            kind=editorial
            [[ $PR_AUTHOR == 'dependabot[bot]' ]] && kind=dependabot
            prs=$(jq -nc --argjson n "$PR" --arg sha "$PR_SHA" --arg kind "$kind" '[{number: $n, sha: $sha, kind: $kind}]')
          else
            # Only non-Dependabot PRs recover from these events: the Dependabot
            # metadata action needs the pull_request payload, so a Dependabot head
            # is never taken here, where its major check would not run.
            base=$(gh api "repos/$REPO" --jq .default_branch)
            prs=$(gh api "repos/$REPO/commits/$SHA/pulls" | jq -c --arg repo "$REPO" --arg sha "$SHA" --arg base "$base" '
              [.[] | select(.state == "open" and .draft == false and .head.sha == $sha
                            and .head.repo.full_name == $repo and .base.ref == $base
                            and .user.login != "dependabot[bot]"
                            and (.head.ref | startswith("land/") | not))
                   | {number, sha: .head.sha, kind: "editorial"}]')
          fi
          # An editorial head with a check run or status still running cannot merge on
          # this evaluation: the merge step would read it pending and stop, and that
          # check's own completion starts the next evaluation. Drop it here, so no merge
          # job is billed for it (machinerelations.ai: ~600 evaluations a day, most of
          # them pending). This gate's own runs and the run that started this evaluation
          # (its read can lag the event) are not counted. A failed or partial read keeps
          # the PR, and the merge step judges it as before.
          still_running() {
            local caller own runs status
            caller="${WORKFLOW_REF:-}"; caller="${caller#"$REPO/"}"
            caller="${caller%%@*}"
            own=$(gh api "repos/$REPO/actions/runs?head_sha=$1&per_page=100" \
              --jq "[.workflow_runs[] | select(.path == \"$caller\") | .check_suite_id]") || return 1
            runs=$(gh api "repos/$REPO/commits/$1/check-runs?per_page=100") || return 1
            status=$(gh api "repos/$REPO/commits/$1/status?per_page=100") || return 1
            jq -en --argjson own "$own" --arg trigger "${TRIGGER_SUITE:-}" --argjson runs "$runs" --argjson status "$status" '
              $runs.total_count <= 100 and $status.total_count <= 100 and
              (any($runs.check_runs[]; .conclusion == null
                    and (.check_suite.id as $s | $own | index($s) | not)
                    and (.check_suite.id | tostring) != $trigger)
               or any($status.statuses[]; .state == "pending"))' >/dev/null
          }
          if [[ $prs != '[]' ]] && jq -e 'all(.[]; .kind == "editorial")' <<<"$prs" >/dev/null &&
             still_running "$(jq -r '.[0].sha' <<<"$prs")"; then
            echo "$EVENT on ${SHA:-$PR_SHA}: a check or status is still running; its completion re-evaluates $prs."
            prs='[]'
          fi
          echo "$EVENT on ${SHA:-$PR_SHA}: $prs"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  merge:
    needs: resolve
    if: needs.resolve.outputs.prs != '' && needs.resolve.outputs.prs != '[]'
    name: merge (#${{ matrix.pr.number }})
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.resolve.outputs.prs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.pr.kind == 'editorial' && 5 || 50 }}
    # Dependabot: one evaluation per PR, and a newer one supersedes the wait on the
    # old. Editorial: every evaluation is its own group, so none is queued behind,
    # replaced by or cancelled by another.
    concurrency:
      group: automerge-${{ github.repository }}-${{ matrix.pr.number }}${{ matrix.pr.kind == 'editorial' && format('-{0}-{1}', github.run_id, github.run_attempt) || '' }}
      cancel-in-progress: ${{ matrix.pr.kind != 'editorial' }}
    steps:
      - name: Take dependabot-eligible off until this evaluation judges the head
        if: matrix.pr.kind == 'dependabot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr.number }}
        run: |
          set -euo pipefail
          labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if grep -qx dependabot-eligible <<<"$labels"; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/dependabot-eligible" >/dev/null
            echo "Took dependabot-eligible off #$PR until this evaluation judges its head."
          fi

      - name: Read Dependabot metadata
        id: metadata
        if: matrix.pr.kind == 'dependabot'
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hold Dependabot updates that cross a major
        id: dependabot
        if: matrix.pr.kind == 'dependabot' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr.number }}
          SHA: ${{ matrix.pr.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          # The metadata alone cannot be trusted either way. Security updates
          # carry no update-type, so any PR that moves more than one version
          # (every grouped PR) reads as empty. And a patch/minor group can still
          # raise a declared range across a major to free a nested pin (next ^15
          # -> ^16 so postcss can move) without listing it. Decide from the files:
          # hold if any package.json range or package-lock.json entry crosses a
          # major (or a 0.x minor), and hold an untyped PR with no lockfile.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | select(.filename | test("(^|/)package(-lock)?\\.json$")) | .filename')
          locks=0
          for f in $files; do
            [[ $f == *package-lock.json ]] && locks=$((locks + 1))
            gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$f?ref=$BASE_SHA" > "$RUNNER_TEMP/base.json"
            gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$f?ref=$SHA" > "$RUNNER_TEMP/head.json"
            if ! crossed=$(node -e '
              const fs = require("fs");
              const [a, b] = process.argv.slice(-2).map((p) => JSON.parse(fs.readFileSync(p, "utf8")));
              const major = (v) => { const m = String(v).match(/(\d+)(?:\.(\d+))?/); return m ? (m[1] === "0" ? "0." + (m[2] ?? "") : m[1]) : String(v); };
              const crossed = [];
              const check = (name, o, v) => { if (typeof o === "string" && typeof v === "string" && o !== v && major(o) !== major(v)) crossed.push(name + " " + o + " -> " + v); };
              for (const s of ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"])
                for (const [n, v] of Object.entries(b[s] || {})) check(n, (a[s] || {})[n], v);
              for (const [p, e] of Object.entries(b.packages || {})) if (p) check(p, ((a.packages || {})[p] || {}).version, e.version);
              if (crossed.length) { console.log(crossed.slice(0, 5).join("; ")); process.exit(1); }
            ' "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"); then
              echo "::notice::Not merging #$PR: $f crosses a major ($crossed)."
              exit 0
            fi
          done
          if [[ ( -z $UPDATE_TYPE || $UPDATE_TYPE == null ) && $locks -eq 0 ]]; then
            echo "::notice::Not merging #$PR: no update type, and no package-lock.json to read one from."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Merge once the head commit is green
        if: matrix.pr.kind == 'editorial' || steps.dependabot.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr.number }}
          SHA: ${{ matrix.pr.sha }}
          KIND: ${{ matrix.pr.kind }}
          REQUIRED: ${{ inputs.editorial-required-checks }}
          CONTENT_WITHOUT_PREVIEW: ${{ inputs.editorial-content-without-preview }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
          # Set when a completed workflow run started this evaluation: that run's
          # check suite is finished, whatever a read just after says.
          TRIGGER_SUITE: ${{ github.event.workflow_run.check_suite_id }}
          # The PR's base on its own events; status and workflow_run events have
          # none, and an eligible editorial PR's base is the default branch.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # A read GitHub answers with a server error or a dropped connection is
          # retried briefly: this evaluation may be the last event its PR gets
          # (website #939 sat green and unmerged after one 502 on 2026-11-04).
          # Only reads: a write keeps its own handling, and a 4xx is never retried.
          # The resolve and merge steps carry this function identically.
          gh() {
            local arg read=1 out err try code=0
            [[ ${1:-} == api ]] || read=0
            for arg in "$@"; do
              case $arg in -X*|--method|--method=*|-f|-F|--field|--field=*|--raw-field|--raw-field=*|--input|--input=*) read=0 ;; esac
            done
            (( read )) || { command gh "$@"; return; }
            out=$(mktemp) err=$(mktemp)
            for try in 1 2 3 4; do
              if command gh "$@" >"$out" 2>"$err"; then cat "$out"; rm -f "$out" "$err"; return 0; else code=$?; fi
              grep -qE 'HTTP 5[0-9]{2}|i/o timeout|connection reset|unexpected EOF|TLS handshake timeout' "$err" && (( try < 4 )) || break
              echo "GitHub answered a read with: $(tr '\n' ' ' <"$err" | head -c 160); retrying." >&2
              sleep $((try * 3))
            done
            cat "$err" >&2; rm -f "$out" "$err"; return "$code"
          }
          # The calling workflow's path, e.g. .github/workflows/dependabot-automerge.yml.
          caller="${WORKFLOW_REF#"$REPO/"}"
          caller="${caller%%@*}"
          base=$(gh api "repos/$REPO" --jq .default_branch)
          # Non-empty when the base merges only through a merge queue, where this
          # gate merges nothing (see the top of this file).
          queue=$(gh api --paginate "repos/$REPO/rules/branches/${BASE_REF:-$base}" --jq '.[] | select(.type == "merge_queue") | .type')
          # Where the PR stands now: merged, closed, moved (head is no longer $SHA),
          # draft, ineligible, conflicting, or open. A conflicting PR (GitHub computed
          # it mergeable false, state dirty, against the current base) is its author's
          # to rebase or close, as a failed check is; the push that resolves it starts
          # a new evaluation. Merging it only earns a 405 and a red gate run on the
          # default branch (christianlehman.com #132, 2026-11-11: a duplicate of #131,
          # which merged a minute earlier).
          pr_state() {
            gh api "repos/$REPO/pulls/$PR" | jq -r --arg sha "$SHA" --arg repo "$REPO" --arg base "$base" --arg kind "$KIND" '
              if .merged then "merged"
              elif .state != "open" then "closed"
              elif .head.sha != $sha then "moved"
              elif .draft then "draft"
              elif $kind == "editorial" and (.head.repo.full_name != $repo or .base.ref != $base
                     or .user.login == "dependabot[bot]" or (.head.ref | startswith("land/"))) then "ineligible"
              elif .mergeable == false and .mergeable_state == "dirty" then "conflicting"
              else "open" end'
          }
          required='[]'
          vercel_contract=false
          page_unjudged=false
          if [[ $KIND == editorial ]]; then
            required=$(printf '%s\n' "$REQUIRED" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | jq -Rsc 'split("\n") | map(select(length > 0))')
            # The caller's list, before the routine path removes Vercel. Presence of
            # that context is the signal; page-check is not added to required.
            if jq -e 'index("Vercel") != null' >/dev/null <<<"$required"; then vercel_contract=true; fi
          fi
          content_only=false
          classify_publication() {
            [[ $KIND == editorial && $REPO == Bramwell-Inc/jaxonparrott.com && $CONTENT_WITHOUT_PREVIEW == true ]] || return 0
            # The files API follows the PR, so bracket it with identity reads.
            local before after files
            before=$(gh api "repos/$REPO/pulls/$PR")
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" | jq -sc 'add')
            after=$(gh api "repos/$REPO/pulls/$PR")
            if jq -ne --arg sha "$SHA" --argjson before "$before" --argjson after "$after" --argjson files "$files" '
              def routine: test("^content/posts/[a-z0-9][a-z0-9-]*\\.md$") or . == "portfolio/retired-pages.json";
              $before.head.sha == $sha and $after.head.sha == $sha and
              $before.base.sha == $after.base.sha and
              $before.changed_files == $after.changed_files and
              ($files | length) == $after.changed_files and ($files | length) > 0 and
              all($files[]; (.filename | routine) and
                  (if .status == "renamed" then (.previous_filename // "" | routine) else true end))
            ' >/dev/null; then
              content_only=true
              required=$(jq -c 'map(select(. != "Vercel")) + ["agentic-verify", "claims", "portfolio-retired-pointers"] | unique' <<<"$required")
            fi
          }
          echo "#$PR ($KIND) at $SHA; required: $required"
          # One read of the head commit. Sets verdict to failed, partial, green or pending.
          read_checks() {
            # Every status context the base's rules require. GitHub refuses a merge without
            # them, so this gate requires them too, for both kinds: a missing one is pending.
            # Otherwise a Dependabot head that is green before such a status is posted gets one
            # merge GitHub refuses, and no later event evaluates it again. Read with the checks,
            # so a rule added while a Dependabot evaluation waits holds it too.
            ruled=$(gh api --paginate "repos/$REPO/rules/branches/${BASE_REF:-$base}" --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' | jq -Rsc 'split("\n") | map(select(length > 0)) | unique')
            # Commit statuses: Vercel reports the build here. At least one must
            # exist outside the scoped routine path, which requires the CI build.
            status=$(gh api "repos/$REPO/commits/$SHA/status?per_page=100")
            statuses=$(jq -c '[.statuses[] | {name: .context, state}]' <<<"$status")
            # Check runs, excluding every run of this gate on the same head (this
            # one, and earlier ones), so the gate never waits on or vetoes itself.
            own=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.path == \"$caller\") | .check_suite_id]")
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100")
            checks=$(jq -c --argjson own "$own" '[.check_runs[] | select(.check_suite.id as $s | $own | index($s) | not)
              | {name, state: (.conclusion // "pending")}]' <<<"$runs")
            # Check runs of the completed run that started this evaluation that the
            # API still reports unfinished: a read that lags the event.
            lagging=$(jq --arg suite "${TRIGGER_SUITE:-}" '[.check_runs[] | select($suite != "" and (.check_suite.id | tostring) == $suite and .conclusion == null)] | length' <<<"$runs")
            # A required name, this caller's or the base's rules', is met only when it is
            # present and every status or check run carrying it succeeded. Skipped and
            # neutral do not meet it. A run that is not listed may be skipped or neutral:
            # a path filter does that, and it is a pass. page-check is not inferred into
            # this list. When the caller listed Vercel and every page-check run is
            # skipped, neutral, or absent, this run records that and does not wait.
            unmet=$(jq -nc --argjson req "$required" --argjson ruled "$ruled" --argjson s "$statuses" --argjson c "$checks" '
              [($req + $ruled | unique)[] as $n | ([$s[], $c[]] | map(select(.name == $n))) as $m
                | select(($m | length) == 0 or any($m[]; .state != "success")) | $n]')
            echo "statuses=$statuses checks=$checks required by the base's rules: $ruled unmet=$unmet"
            waiting=$(jq -nc --argjson s "$statuses" --argjson c "$checks" --argjson u "$unmet" --arg content "$content_only" '
              [(if ($s | length) == 0 and $content != "true" then "a commit status" else empty end), ($s[] | select(.state != "success") | .name),
               ($c[] | select(.state != "success" and .state != "skipped" and .state != "neutral") | .name), $u[]] | unique')
            if jq -e 'any(.[]; .state == "failure" or .state == "error")' <<<"$statuses" >/dev/null ||
               jq -e 'any(.[]; .state == "failure" or .state == "cancelled" or .state == "timed_out" or .state == "action_required" or .state == "startup_failure")' <<<"$checks" >/dev/null; then
              verdict=failed
            # A page beyond the first could hide a failure; never merge on a partial read.
            elif (( $(jq '.total_count' <<<"$status") > 100 || $(jq '.total_count' <<<"$runs") > 100 )); then
              verdict=partial
            elif jq -e --arg content "$content_only" '(length > 0 or $content == "true") and all(.[]; .state == "success")' <<<"$statuses" >/dev/null &&
                 jq -e 'all(.[]; .state == "success" or .state == "skipped" or .state == "neutral")' <<<"$checks" >/dev/null &&
                 jq -e 'length == 0' <<<"$unmet" >/dev/null; then
              verdict=green
            else
              verdict=pending
            fi
            page_unjudged=false
            if [[ $vercel_contract == true ]] && jq -e '[.[] | select(.name == "page-check")] | length == 0 or all(.[]; .state == "skipped" or .state == "neutral")' >/dev/null <<<"$checks"; then
              page_unjudged=true
            fi
          }
          # The advisory is this run's own warning and summary. Editorial evaluations
          # overlap, so a pull request comment written after a lookup can be posted
          # twice. There is no shared write here.
          note_unjudged() {
            [[ $page_unjudged == true ]] || return 0
            local line="Page check did not judge ${SHA}. The page-check run was skipped, neutral, or not there. This is not a clean page judgment, and it is not a hold. A finished Page check that fails still stops a merge."
            echo "::warning::$line"
            if [[ -n ${GITHUB_STEP_SUMMARY:-} ]]; then printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"; fi
          }

          if [[ $KIND == editorial ]]; then
            # Single-shot: read once, merge if green, otherwise leave it to the
            # next status or workflow run on this head. Nothing here waits.
            state=$(pr_state)
            if [[ $state == merged ]]; then
              echo "::notice::#$PR is already merged."
              exit 0
            elif [[ $state != open ]]; then
              echo "::notice::Not merging #$PR: it is $state (judged head $SHA)."
              exit 0
            fi
            if [[ -n $queue ]]; then
              echo "::notice::Not merging #$PR: $base merges only through a merge queue, which this workflow's token cannot use; a seat merges it there."
              exit 0
            fi
            classify_publication
            echo "content_only=$content_only; required: $required"
            read_checks
            # This evaluation may be the last event this head gets, so a read that
            # lags the run which started it is retried briefly instead of trusted.
            for retry in 1 2 3 4; do
              [[ $verdict == pending ]] && (( lagging > 0 )) || break
              echo "The run that started this evaluation completed, but $lagging of its check runs still read unfinished; re-reading."
              sleep 15
              read_checks
            done
            case $verdict in
              failed) echo "::notice::Not merging #$PR: a check failed on $SHA."; exit 0 ;;
              partial) echo "::notice::Not merging #$PR: more than 100 statuses or check runs on $SHA."; exit 0 ;;
              pending) echo "::notice::Not merging #$PR yet: $SHA is waiting on $waiting. The status or workflow run that completes it re-evaluates the PR."; exit 0 ;;
            esac
            note_unjudged
            # GitHub refuses this merge unless the head is still $SHA (409). It also
            # refuses while another evaluation of the same green head is merging it,
            # or when the base moved under a merge a moment ago (405): the merge is
            # retried briefly, since no later event may come to retry it.
            title=$(gh api "repos/$REPO/pulls/$PR" --jq .title)
            for attempt in 1 2 3 4; do
              if merged=$(gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$SHA" \
                            -f commit_title="$title (#$PR)" 2>"$RUNNER_TEMP/merge.err"); then
                after=$(jq -r .sha <<<"$merged")
                echo "::notice::Merged #$PR at its judged head $SHA; merge commit $after."
                # A successful merge is not ownership; the evaluation that creates the claim
                # ref sends the dispatch (see the top of this file).
                claim="refs/editorial-merged/$after"
                claimed=false
                for try in 1 2 3; do
                  if gh api -X POST "repos/$REPO/git/refs" -f ref="$claim" -f sha="$after" >/dev/null 2>"$RUNNER_TEMP/claim.err"; then
                    claimed=true
                    break
                  elif grep -q 'Reference already exists' "$RUNNER_TEMP/claim.err"; then
                    # After a failed try, the ref may be this evaluation's own claim.
                    (( try > 1 )) && break
                    echo "::notice::#$PR is merged at $after; a concurrent evaluation claimed $claim, so that one sends editorial-merged."
                    exit 0
                  fi
                  (( try == 3 )) || sleep $((try * 3))
                done
                [[ $claimed == true ]] || echo "::warning::#$PR is merged at $after, but $claim could not be claimed: $(tr '\n' ' ' <"$RUNNER_TEMP/claim.err" | head -c 160). Sending editorial-merged anyway; it may arrive twice."
                before=$(gh api "repos/$REPO/commits/$after" --jq '.parents[0].sha')
                payload=$(jq -nc --arg before "$before" --arg after "$after" --argjson pr "$PR" \
                  '{event_type: "editorial-merged", client_payload: {before: $before, after: $after, pr: $pr}}')
                for try in 1 2 3; do
                  if gh api "repos/$REPO/dispatches" --input - <<<"$payload"; then
                    echo "::notice::Sent editorial-merged for #$PR: $payload"
                    exit 0
                  fi
                  sleep $((try * 5))
                done
                echo "::error::#$PR is merged at $after, but editorial-merged was not sent; its post-merge workflows did not start."
                exit 1
              fi
              refusal=$(cat "$RUNNER_TEMP/merge.err" 2>/dev/null || true)
              echo "Merge attempt $attempt refused: $refusal"
              sleep $((attempt * 3))
              state=$(pr_state)
              case $state in
                merged) echo "::notice::#$PR was merged by a concurrent evaluation of the same head; that one sends editorial-merged."; exit 0 ;;
                open) ;;
                *) echo "::notice::Not merging #$PR: it is $state (judged head $SHA)."; exit 0 ;;
              esac
            done
            echo "::error::GitHub refused to merge #$PR at its green head $SHA: $refusal"
            exit 1
          fi

          # Dependabot. A newer evaluation of this PR cancels this one. Bash defers
          # a signal until a foreground child exits, so sleep in the background and
          # leave as soon as the runner signals, instead of evaluating once more.
          trap 'echo "Superseded by a newer evaluation of #$PR."; exit 143' INT TERM
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            state=$(pr_state)
            if [[ $state == merged ]]; then
              echo "::notice::#$PR is already merged."
              exit 0
            elif [[ $state != open ]]; then
              echo "::notice::Not merging #$PR: it is $state (judged head $SHA)."
              exit 0
            fi
            read_checks
            if [[ $verdict == failed ]]; then
              echo "::notice::Not merging #$PR: a check failed on $SHA."
              exit 0
            fi
            if [[ $verdict == partial ]]; then
              echo "::notice::Not merging #$PR: more than 100 statuses or check runs on $SHA."
              exit 0
            fi
            if [[ $verdict == green ]]; then
              # From here a newer evaluation no longer stops this one.
              trap 'echo "Superseded while merging #$PR; finishing first."' INT TERM
              if [[ -n $queue ]]; then
                # The repository's first eligible PR creates the label; until then GitHub answers 404.
                gh api "repos/$REPO/labels/dependabot-eligible" >/dev/null 2>&1 ||
                  gh api "repos/$REPO/labels" -f name=dependabot-eligible -f color=0e8a16 \
                    -f description="Eligible and green for the Auto-merge gate; CodeOps merges it through the merge queue" >/dev/null
                gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=dependabot-eligible" >/dev/null
                said=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                  --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Auto-merge gate:"))) | .id')
                if [[ -z $said ]]; then
                  gh api "repos/$REPO/issues/$PR/comments" -f body="Auto-merge gate: eligible and green. This base merges only through a merge queue, which the workflow token cannot use, so this pull request is labelled \`dependabot-eligible\` and a CodeOps seat merges it through the merge queue." >/dev/null
                fi
                echo "::notice::#$PR is eligible and green at $SHA. Its base merges only through a merge queue, so it is labelled dependabot-eligible for a CodeOps seat to merge there."
                exit 0
              fi
              # GitHub refuses this merge unless the head is still $SHA. A refusal
              # or a concurrent merge is settled by reading the PR back.
              gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA" || true
              for _ in 1 2 3 4 5; do
                state=$(pr_state)
                [[ $state == open ]] || break
                sleep 3
              done
              case $state in
                merged)
                  merged=$(gh api "repos/$REPO/pulls/$PR")
                  echo "::notice::#$PR is merged; it was judged and merged at $SHA ($(jq -r '"head \(.head.sha), merge commit \(.merge_commit_sha), by \(.merged_by.login)"' <<<"$merged"))"
                  exit 0 ;;
                moved)
                  echo "::notice::Not merging #$PR: its head moved off $SHA."
                  exit 0 ;;
                conflicting)
                  echo "::notice::Not merging #$PR: it conflicts with its base; Dependabot rebases it."
                  exit 0 ;;
                *)
                  echo "::error::Merging #$PR at $SHA failed; the PR is $state."
                  exit 1 ;;
              esac
            fi
            if (( SECONDS >= deadline )); then
              echo "::notice::Not merging #$PR yet: checks on $SHA still pending after $WAIT_MINUTES minutes."
              exit 0
            fi
            sleep 60 &
            wait $!
          done
